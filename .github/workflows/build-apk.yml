name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu-latest đã có sẵn Android SDK + license được chấp
      # nhận sẵn tại $ANDROID_HOME, nên không cần bước setup-android riêng.
      # AGP sẽ tự tải thêm platform/build-tools còn thiếu nếu cần.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Khóa ký cố định (repo secret) để mọi bản build cài đè được lên nhau. Thiếu secret
      # (ví dụ repo fork) thì bước build rơi về khóa debug ngẫu nhiên của runner.
      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/opennotify.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/opennotify.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 chưa được đặt — APK sẽ ký bằng khóa debug ngẫu nhiên, không cài đè được bản cũ."
          fi

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennotify-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
